configuration:
  email_remetente:
    name: Sender email (Gmail)
    description: Gmail account used to send password recovery codes. Leave empty to disable email.
  email_palavra_passe:
    name: App password
    description: 16-letter app password created in the Google account (Security › App passwords). Do not use the normal account password.
  email_nome:
    name: Sender name
    description: Name shown as the sender of the emails.
  turnstile_site_key:
    name: Turnstile site key
    description: Public key of the Cloudflare Turnstile widget (Cloudflare dashboard › Turnstile). Pre-filled.
  turnstile_secret:
    name: Turnstile secret key
    description: Secret key of the same widget. When set, login and password recovery require the anti-bot check for requests arriving through the tunnel (from outside the home). Leave empty to disable.
network:
  3000/tcp: Direct access on the home network and for Cloudflare Tunnel. Leave empty to disable.
